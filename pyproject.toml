[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dorothea"]

[project]
name = "dorothea"
version = "1.9.3"
description = "Static photography website generator: turn folders of photos and videos into a photo essay. A Python port of expose.sh"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
authors = [{ name = "Marco Lussetti" }, { name = "Jack Qiao" }]
keywords = ["photography", "gallery", "static site generator", "photo essay", "expose"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "click>=8.5",
    "exifread>=3.5",
    "imageio-ffmpeg>=0.6",
    "markdown>=3.9",
    "pillow>=11.3.0",
    "pillow-heif>=1.8",
    "rich>=15",
]

[project.urls]
Homepage = "https://github.com/marcolussetti/dorothea"
Documentation = "https://dorothea.readthedocs.io/"
Changelog = "https://dorothea.readthedocs.io/changelog/"

[project.scripts]
dorothea = "dorothea.cli:main"
expose = "dorothea.cli:main"  # familiar name for expose.sh users

[dependency-groups]
dev = [
    "feedparser>=6.0.14",
    "jsonschema>=4.26.0",
    "pytest",
    "pytest-cov",
    "pytest-order",
    "ruff==0.16.9",
    "ty==0.0.84",
]  # keep in sync with .pre-commit-config.yaml
docs = [
    "zensical==0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (parity tests)",
    "final: marks tests that run only after all others pass",
]
addopts = "--cov=src/dorothea --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/dorothea"]
omit = [
    "src/dorothea/themes/*",
    "tests/reference/*",
    "tests/*",
    "_site/*",
    ".pytest_cache/*",
    "uv.lock",
]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true
exclude = [
    "src/dorothea/themes/",
    "tests/reference/",
    "_site/",
    ".git/",
    ".pytest_cache/",
    "htmlcov/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
