# Read the Docs build for the docs site (mkdocs.yml), following RTD's Zensical guide:
# https://docs.readthedocs.com/platform/latest/intro/zensical.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  commands:
    - pip install uv
    - uv sync --only-group docs
    - uv run --only-group docs zensical build --strict
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -r .sandbox/docs/. $READTHEDOCS_OUTPUT/html/
