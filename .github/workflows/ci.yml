name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event-file:
    # report.yml (triggered by this workflow) needs the triggering event, e.g. the PR number
    name: Save event
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: event
          path: ${{ github.event_path }}

  lint:
    name: Lint (ruff, format, ty, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uvx prek run --all-files --show-diff-on-failure

  test-full:
    # Everything installed, including expose.sh's own dependencies, so the parity tests
    # run. Arch ships ImageMagick 7 and ffmpeg with x264 (like the dev machine); Ubuntu's
    # ImageMagick 6 picks different JPEG chroma subsampling than the one we match.
    # nodejs runs the themes' keyboard.js tests (tests/js/).
    name: Tests + parity (ImageMagick, ffmpeg, perl, node)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: >-
          pacman -Syu --noconfirm --needed
          git make bash which file rsync perl imagemagick ffmpeg nodejs uv cloc
      - uses: actions/checkout@v7
      - run: uv sync
      # Also writes reports/junit.xml and reports/coverage.xml
      - run: make test-cov
      - name: Lines of code
        if: ${{ !cancelled() }}
        run: make stats
      # report.yml turns these into the PR comments and README badges
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-full
          path: reports/
          if-no-files-found: ignore

  test-minimal:
    # No ffmpeg or ImageMagick on the system: proves `uv tool install` needs nothing else
    # (the bundled imageio-ffmpeg binary and Pillow are used). Parity tests skip here.
    name: Tests without system packages
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - uses: actions/checkout@v7
      - name: Check the environment really is minimal
        # (`! cmd` lines don't trip `set -e`, so each tool is checked explicitly)
        run: |
          for tool in ffmpeg convert magick; do
            if command -v "$tool"; then echo "$tool is installed; this job needs a bare image"; exit 1; fi
          done
      - run: uv sync
      - run: uv run pytest -m "not slow" --no-cov --junitxml=reports/junit-minimal.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-minimal
          path: reports/
          if-no-files-found: ignore

  test-windows:
    # Windows (#19): no ImageMagick, but System32\convert.exe is on PATH and must not be
    # mistaken for it; ffmpeg is the bundled imageio-ffmpeg binary. Parity tests need
    # expose.sh's toolchain and stay Linux-only (they skip here).
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest -m "not slow" --no-cov --junitxml=reports/junit-windows.xml
      - name: Real video encodes (2-pass, audio, progress)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/unit/test_audio.py tests/unit/test_progress.py --no-cov
          -m slow --junitxml=reports/junit-windows-video.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-windows
          path: reports/
          if-no-files-found: ignore
      - name: Build a gallery from the wheel
        shell: bash
        run: |
          uv build
          wheel=$(ls dist/*.whl)
          gallery=$(mktemp -d)
          cp -r tests/data/test_run/. "$gallery"
          rm -rf "$gallery/_site"
          (cd "$gallery" && uvx --isolated --from "$GITHUB_WORKSPACE/$wheel" dorothea -d)
          test -s "$gallery/_site/index.html"
          test -s "$gallery/_site/nature/mountains/peak/1024.jpg"

  package:
    # Build the wheel and sdist and run them the way users will (`uvx dorothea`,
    # `pipx run dorothea`), outside the source tree, with no ffmpeg or ImageMagick installed.
    # Catches what the test suite can't: themes missing from the package, broken entry
    # points, dependencies missing from pyproject.toml.
    name: Package (uvx, pipx)
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - uses: actions/checkout@v7
      - run: uv build
      - name: Entry points
        run: |
          wheel=$(ls dist/*.whl)
          uvx --isolated --from "$wheel" dorothea --version
          uvx --isolated --from "$wheel" expose --version
          # the pipx command the README documents (pipx doesn't pick Python from the package)
          uvx pipx run --no-cache --python 3.14 --fetch-python=missing --spec "$wheel" dorothea --version
      - name: Build a gallery from the wheel and from the sdist
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            gallery=$(mktemp -d)
            cp -r tests/data/test_run/. "$gallery"
            rm -rf "$gallery/_site"
            (cd "$gallery" && uvx --isolated --from "$GITHUB_WORKSPACE/$dist" dorothea -d)
            test -s "$gallery/_site/index.html"
            test -s "$gallery/_site/global.css"
            test -s "$gallery/_site/nature/mountains/peak/1024.jpg"
            echo "OK: $dist"
          done
