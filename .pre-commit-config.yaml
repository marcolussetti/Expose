# Pre-commit configuration for dorothea
# Excludes legacy theme files and expose.sh

# Hooks that parse Python (debug-statements) must run on the project's minimum version (3.14)
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(theme1/|theme2/|Markdown_1.0.1/|expose.sh)
      - id: end-of-file-fixer
        exclude: ^(theme1/|theme2/|Markdown_1.0.1/|expose.sh)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in sync with pyproject.toml dev group
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(theme1/|theme2/|Markdown_1.0.1/|expose.sh)
      - id: ruff-format
        exclude: ^(theme1/|theme2/|Markdown_1.0.1/|expose.sh)

  - repo: local
    hooks:
      # GitHub Actions workflows: syntax/expression errors, unknown action inputs, and shellcheck
      # on `run:` steps. The PyPI builds bring their own shellcheck, so a commit checks the same
      # things as CI (rhysd/actionlint's own hook silently skips shellcheck when it's missing).
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: python
        additional_dependencies: [actionlint-py==1.7.12.25, shellcheck-py==0.11.0.1]
        files: ^\.github/workflows/.*\.ya?ml$
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
