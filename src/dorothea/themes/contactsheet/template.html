<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{sitetitle}} - {{gallerytitle}}</title>
	<link rel="stylesheet" href="{{basepath}}global.css" />
	<script src="{{basepath}}keyboard.js" data-slides="" data-blocked-by="#lightbox[open]"></script>
	<script src="{{basepath}}photo-info.js"></script>
	<script src="{{basepath}}contactsheet.js" defer></script>{{feed_link}}
</head>
<body data-resolution="{{resolution}}" data-respath="{{resourcepath}}" data-videoformats="{{videoformats}}">

<nav id="sidebar" aria-label="Galleries">
	<div class="masthead">
		<p class="sitetitle">{{sitetitle}}</p>
		<h1 class="gallerytitle">{{gallerytitle}}</h1>
		<button type="button" id="menubutton" aria-expanded="false" aria-controls="menu">Galleries</button>
	</div>
	<div id="menu">
		<ul id="nav">
			{{navigation}}
		</ul>
		<ul id="links">{{feed_button}}{{album_download}}
		</ul>
	</div>
</nav>

<main id="sheet">
	{{content}}
</main>

<div id="comments">
	<div id="disqus_thread"></div>
</div>

<script>
	var disqus_shortname = '{{disqus_shortname}}';
	var disqus_identifier = '{{disqus_identifier}}';

	if(disqus_shortname){
		(function() {
			var dsq = document.createElement('script'); dsq.async = true;
			dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
			(document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
		})();
	}
</script>

<dialog id="lightbox" aria-label="Photo" tabindex="-1" autofocus>
	<div class="stage"></div>
	<div class="details"></div>
	<button type="button" class="previous" aria-label="Previous photo">&#8249;</button>
	<button type="button" class="next" aria-label="Next photo">&#8250;</button>
	<button type="button" class="close" aria-label="Close">&#215;</button>
</dialog>

</body>
</html>
